# GridDB Connection
griddb.base-url=${GRIDDB_BASE_URL:https://<cluster-host>/griddb/v2/<cluster-name>/dbs/<database>}
griddb.api-key=${GRIDDB_API_KEY:}
griddb.username=${GRIDDB_USER:your_contract_id-your_username}
griddb.password=${GRIDDB_PASSWORD:your_password}
griddb.container-name=${GRIDDB_CONTAINER:solar_radiation_records}

# Application
spring.application.name=solar-potential-analytics
server.port=8080

# Thymeleaf
spring.thymeleaf.cache=false

# Actuator
management.endpoints.web.exposure.include=*

# Logging
logging.level.com.griddb.solar=DEBUG
logging.level.root=INFO

# Data directory for real solar radiation CSVs (e.g., NASA POWER)
solar.data.dir=${SOLAR_DATA_DIR:src/main/resources/data}

# Auto-seed with synthetic data if no real CSV found
app.seed-data.enabled=true
